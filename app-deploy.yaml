apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi-app-deploy  
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fastapi-app
  template:
    metadata:
      labels:
        app: fastapi-app
    spec:
      imagePullSecrets:
        - name: dockerhub-secret
      containers:
      - name: fastapi-app-container
        image: mdanis25/demo-fastapi-app:v1.0.0 
        resources:
          requests:
            memory: "64Mi"
            cpu: "250m"
          limits:
            memory: "128Mi"
            cpu: "500m"
        ports:
        - containerPort: 8000
 